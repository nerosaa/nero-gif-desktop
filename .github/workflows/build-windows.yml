# Build Windows zip via GitHub Actions (windows-latest).
# Artifact: NERO-Tools-GIF-Converter-windows-x64.zip
#
# NEVER put the Ed25519 PRIVATE key, real NERO1 buyer keys, or any secret
# in this workflow, env, or logs. The app embeds only the PUBLIC key;
# license minting stays offline with NERO (scripts/gen_license.py).

name: Build Windows

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "GETLY_DRAFT.md"
      - "PRODUCT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.0"

      - name: Install ffmpeg (Chocolatey)
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version

      - name: Unit tests (license, presets fit loop, i18n coverage, recorder cmd)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v

      - name: Smoke convert (free watermarked)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if (-not (Test-Path tests\out)) { New-Item -ItemType Directory -Path tests\out | Out-Null }
          python -m nero_gif status
          python -m nero_gif convert tests\fixtures\sample.mp4 `
            -o tests\out\ci_free.gif --duration 2 --width 320 --fps 10 --force-free
          if (-not (Test-Path tests\out\ci_free.gif)) { throw "ci_free.gif missing" }
          python -m nero_gif social tests\fixtures\sample.mp4 --preset discord `
            -o tests\out\ci_discord.gif --force-free
          if (-not (Test-Path tests\out\ci_discord.gif)) { throw "ci_discord.gif missing" }
          python -m nero_gif social tests\fixtures\sample.mp4 --preset sticker `
            -o tests\out\ci_sticker.gif --force-free
          if (-not (Test-Path tests\out\ci_sticker.gif)) { throw "ci_sticker.gif missing" }
          Write-Host "Smoke OK"

      # Best effort: hosted runners may have no interactive desktop, so gdigrab can fail
      # here even though it works on a real PC. Real check = NERO's Windows test.
      - name: gdigrab probe (best effort)
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m nero_gif record -o tests\out\ci_rec.gif --region 0,0,320,240 --seconds 2 --fps 10 --force-free
          if (Test-Path tests\out\ci_rec.gif) { Get-Item tests\out\ci_rec.gif | Format-List Name, Length }

      - name: PyInstaller one-folder (GUI)
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name NeroGifConverter `
            --add-data "assets\DejaVuSans.ttf;assets" `
            --add-data "nero_gif\locales;nero_gif\locales" `
            --hidden-import nero_gif `
            --hidden-import nero_gif.gui `
            --hidden-import nero_gif.converter `
            --hidden-import nero_gif.license_check `
            --hidden-import nero_gif._ed25519 `
            --hidden-import nero_gif.paths `
            --hidden-import nero_gif.cli `
            --hidden-import nero_gif.i18n `
            --hidden-import nero_gif.presets `
            --hidden-import nero_gif.recorder `
            run_gui.py
          if (-not (Test-Path dist\NeroGifConverter\NeroGifConverter.exe)) {
            throw "NeroGifConverter.exe not produced"
          }
          $loc = Get-ChildItem -Recurse dist\NeroGifConverter -Filter zh-Hans.json
          if (-not $loc) { throw "locales not bundled" }
          $n = (Get-ChildItem $loc[0].DirectoryName -Filter *.json).Count
          if ($n -lt 10) { throw "only $n locale files bundled" }
          Write-Host "Bundled $n locale files in $($loc[0].DirectoryName)"

      - name: Stage zip contents
        run: |
          $stage = "artifact-stage\NERO-Tools-GIF-Converter"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force dist\NeroGifConverter\* $stage\
          Copy-Item -Force README.md $stage\README.md
          Copy-Item -Force README-WINDOWS.txt $stage\README-WINDOWS.txt
          Copy-Item -Force third_party\FFMPEG_NOTICE.md $stage\FFMPEG_NOTICE.md
          Copy-Item -Force third_party\ED25519_NOTICE.md $stage\ED25519_NOTICE.md
          Copy-Item -Force LICENSE $stage\LICENSE

      - name: Zip artifact
        run: |
          $zip = "NERO-Tools-GIF-Converter-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path artifact-stage\NERO-Tools-GIF-Converter\* `
            -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name, Length, FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NERO-Tools-GIF-Converter-windows-x64
          path: NERO-Tools-GIF-Converter-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
